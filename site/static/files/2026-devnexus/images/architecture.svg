<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="agentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3 L 0 6 z" fill="#64748b"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3 L 0 6 z" fill="#d97706"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3 L 0 6 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="820" rx="12" fill="#f8fafc"/>

  <!-- Title -->
  <rect x="0" y="0" width="1100" height="52" rx="12" fill="url(#headerGrad)"/>
  <rect x="0" y="20" width="1100" height="32" fill="url(#headerGrad)"/>
  <text x="550" y="34" text-anchor="middle" fill="white" font-size="20" font-weight="700">Soloplay — Application Architecture</text>

  <!-- ════════════════════════════════════════════════ -->
  <!-- CLIENT LAYER -->
  <!-- ════════════════════════════════════════════════ -->
  <text x="30" y="82" fill="#475569" font-size="11" font-weight="600" letter-spacing="1.5">CLIENT</text>

  <!-- Browser -->
  <rect x="30" y="92" width="1040" height="56" rx="8" fill="#e0f2fe" stroke="#7dd3fc" filter="url(#shadow)"/>
  <text x="550" y="116" text-anchor="middle" fill="#0369a1" font-size="13" font-weight="600">Browser (Renarde Qute Templates + Vanilla JS)</text>
  <text x="550" y="134" text-anchor="middle" fill="#0c4a6e" font-size="11">chat-interface.js  |  play-interface.js (WebSocket)  |  game-index.js  |  inspect.js</text>

  <!-- Arrows: browser → API layer -->
  <line x1="260" y1="148" x2="260" y2="172" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="272" y="166" fill="#64748b" font-size="9">REST</text>
  <line x1="550" y1="148" x2="550" y2="172" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="562" y="166" fill="#7c3aed" font-size="9">WebSocket</text>
  <line x1="840" y1="148" x2="840" y2="172" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="852" y="166" fill="#64748b" font-size="9">REST</text>

  <!-- ════════════════════════════════════════════════ -->
  <!-- API / TRANSPORT LAYER -->
  <!-- ════════════════════════════════════════════════ -->
  <text x="30" y="188" fill="#475569" font-size="11" font-weight="600" letter-spacing="1.5">API / TRANSPORT</text>

  <rect x="30" y="196" width="280" height="44" rx="8" fill="#dbeafe" stroke="#93c5fd" filter="url(#shadow)"/>
  <text x="170" y="215" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="600">ChatResource</text>
  <text x="170" y="230" text-anchor="middle" fill="#1e40af" font-size="10">/api/chat</text>

  <rect x="410" y="196" width="280" height="44" rx="8" fill="#ede9fe" stroke="#c4b5fd" filter="url(#shadow)"/>
  <text x="550" y="215" text-anchor="middle" fill="#5b21b6" font-size="12" font-weight="600">PlayWebSocket</text>
  <text x="550" y="230" text-anchor="middle" fill="#5b21b6" font-size="10">/ws/play/{gameId}</text>

  <rect x="790" y="196" width="280" height="44" rx="8" fill="#dbeafe" stroke="#93c5fd" filter="url(#shadow)"/>
  <text x="930" y="215" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="600">LoreResource  |  GameResource</text>
  <text x="930" y="230" text-anchor="middle" fill="#1e40af" font-size="10">/api/lore  |  /api/game</text>

  <!-- Arrows: API → Engine layer -->
  <line x1="170" y1="240" x2="170" y2="280" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="240" x2="550" y2="280" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="930" y1="240" x2="930" y2="280" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ════════════════════════════════════════════════ -->
  <!-- ENGINE / ORCHESTRATION LAYER -->
  <!-- ════════════════════════════════════════════════ -->
  <text x="30" y="296" fill="#475569" font-size="11" font-weight="600" letter-spacing="1.5">ENGINE / ORCHESTRATION</text>

  <!-- Game phases -->
  <rect x="30" y="304" width="280" height="52" rx="8" fill="#f0fdf4" stroke="#86efac" filter="url(#shadow)"/>
  <text x="170" y="326" text-anchor="middle" fill="#166534" font-size="12" font-weight="600">GameEngine</text>
  <text x="170" y="344" text-anchor="middle" fill="#166534" font-size="10">Phase routing: CREATE → INIT → PLAY</text>

  <rect x="410" y="304" width="280" height="52" rx="8" fill="#f0fdf4" stroke="#86efac" filter="url(#shadow)"/>
  <text x="550" y="326" text-anchor="middle" fill="#166534" font-size="12" font-weight="600">GamePlayEngine</text>
  <text x="550" y="344" text-anchor="middle" fill="#166534" font-size="10">Turn processing + world-state updates</text>

  <rect x="790" y="304" width="280" height="52" rx="8" fill="#f0fdf4" stroke="#86efac" filter="url(#shadow)"/>
  <text x="930" y="326" text-anchor="middle" fill="#166534" font-size="12" font-weight="600">ActorCreationEngine</text>
  <text x="930" y="344" text-anchor="middle" fill="#166534" font-size="10">Multi-stage character creation flow</text>

  <!-- Arrow: GamePlayEngine → AgentOrchestrator -->
  <line x1="550" y1="356" x2="550" y2="390" stroke="#d97706" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- ════════════════════════════════════════════════════ -->
  <!-- AGENT ORCHESTRATION (highlighted zone) -->
  <!-- ════════════════════════════════════════════════════ -->
  <rect x="60" y="395" width="980" height="220" rx="12" fill="url(#agentGrad)" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 3" filter="url(#shadow)"/>
  <text x="550" y="418" text-anchor="middle" fill="#92400e" font-size="14" font-weight="700">AgentOrchestrator  (Level 4 — Agentic Gameplay)</text>
  <text x="550" y="434" text-anchor="middle" fill="#92400e" font-size="10">Coordinates 5 specialized @RegisterAiService agents per turn</text>

  <!-- Phase 1: Dice (sync, first) -->
  <rect x="90" y="450" width="160" height="70" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="170" y="470" text-anchor="middle" fill="#92400e" font-size="11" font-weight="700">1. DiceAgent</text>
  <text x="170" y="485" text-anchor="middle" fill="#78350f" font-size="9">Sync — runs first</text>
  <text x="170" y="500" text-anchor="middle" fill="#78350f" font-size="9">Decides if a roll is needed</text>
  <text x="170" y="512" text-anchor="middle" fill="#a16207" font-size="8" font-style="italic">Stateless</text>

  <!-- Arrow: dice → narration -->
  <line x1="250" y1="485" x2="290" y2="485" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

  <!-- Phase 2: Narration (sync, informed by dice) -->
  <rect x="290" y="450" width="200" height="70" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="390" y="470" text-anchor="middle" fill="#991b1b" font-size="11" font-weight="700">2. NarrationAgent</text>
  <text x="390" y="485" text-anchor="middle" fill="#991b1b" font-size="9">Sync — informed by dice</text>
  <text x="390" y="500" text-anchor="middle" fill="#991b1b" font-size="9">Scene narration + storytelling</text>
  <text x="390" y="512" text-anchor="middle" fill="#dc2626" font-size="8" font-style="italic">Stateful (memory + tools)</text>

  <!-- Phase 3: Concurrent agents -->
  <rect x="530" y="448" width="140" height="56" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="600" y="470" text-anchor="middle" fill="#1e3a8a" font-size="11" font-weight="700">SuggestionAgent</text>
  <text x="600" y="486" text-anchor="middle" fill="#1e3a8a" font-size="9">2–3 action choices</text>
  <text x="600" y="498" text-anchor="middle" fill="#2563eb" font-size="8" font-style="italic">Stateless</text>

  <rect x="690" y="448" width="140" height="56" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="760" y="470" text-anchor="middle" fill="#1e3a8a" font-size="11" font-weight="700">CheckpointAgent</text>
  <text x="760" y="486" text-anchor="middle" fill="#1e3a8a" font-size="9">Milestone detection</text>
  <text x="760" y="498" text-anchor="middle" fill="#2563eb" font-size="8" font-style="italic">Stateless</text>

  <rect x="850" y="448" width="140" height="56" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="920" y="470" text-anchor="middle" fill="#1e3a8a" font-size="11" font-weight="700">RecapAgent</text>
  <text x="920" y="486" text-anchor="middle" fill="#1e3a8a" font-size="9">1–2 sentence summary</text>
  <text x="920" y="498" text-anchor="middle" fill="#2563eb" font-size="8" font-style="italic">Stateless</text>

  <!-- Concurrent bracket -->
  <text x="760" y="442" text-anchor="middle" fill="#1e40af" font-size="10" font-weight="600">3. Concurrent (CompletableFuture)</text>

  <!-- Arrow: narration → concurrent -->
  <line x1="490" y1="485" x2="528" y2="476" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

  <!-- Tool access callout for NarrationAgent -->
  <rect x="180" y="530" width="340" height="44" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="350" y="548" text-anchor="middle" fill="#991b1b" font-size="10" font-weight="600">NarrationAgent Tool Access</text>
  <text x="350" y="562" text-anchor="middle" fill="#991b1b" font-size="9">LoreTools (RAG search)  +  GameTools (actors, locations, recap)</text>
  <line x1="390" y1="520" x2="350" y2="530" stroke="#fca5a5" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Assembled response -->
  <rect x="620" y="530" width="340" height="44" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="790" y="548" text-anchor="middle" fill="#166534" font-size="10" font-weight="600">GamePlayResponse (assembled)</text>
  <text x="790" y="562" text-anchor="middle" fill="#166534" font-size="9">narration + dice + suggestions + checkpoint + recap</text>

  <!-- Arrows: assembled ← concurrent agents -->
  <line x1="600" y1="504" x2="700" y2="530" stroke="#64748b" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="760" y1="504" x2="760" y2="530" stroke="#64748b" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="920" y1="504" x2="860" y2="530" stroke="#64748b" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Response arrow out of agent zone -->
  <line x1="790" y1="574" x2="790" y2="620" stroke="#d97706" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- ════════════════════════════════════════════════ -->
  <!-- AI SERVICE LAYER -->
  <!-- ════════════════════════════════════════════════ -->
  <text x="30" y="640" fill="#475569" font-size="11" font-weight="600" letter-spacing="1.5">AI SERVICES (LangChain4j @RegisterAiService)</text>

  <rect x="30" y="650" width="220" height="44" rx="8" fill="#faf5ff" stroke="#d8b4fe" filter="url(#shadow)"/>
  <text x="140" y="669" text-anchor="middle" fill="#6b21a8" font-size="12" font-weight="600">ChatAssistant</text>
  <text x="140" y="684" text-anchor="middle" fill="#6b21a8" font-size="10">Plain LLM chat</text>

  <rect x="280" y="650" width="220" height="44" rx="8" fill="#faf5ff" stroke="#d8b4fe" filter="url(#shadow)"/>
  <text x="390" y="669" text-anchor="middle" fill="#6b21a8" font-size="12" font-weight="600">LoreAssistant</text>
  <text x="390" y="684" text-anchor="middle" fill="#6b21a8" font-size="10">RAG + LoreRetriever</text>

  <rect x="530" y="650" width="240" height="44" rx="8" fill="#faf5ff" stroke="#d8b4fe" filter="url(#shadow)"/>
  <text x="650" y="669" text-anchor="middle" fill="#6b21a8" font-size="12" font-weight="600">ActorCreationAssistant</text>
  <text x="650" y="684" text-anchor="middle" fill="#6b21a8" font-size="10">Session memory + JSON output</text>

  <rect x="800" y="650" width="270" height="44" rx="8" fill="#faf5ff" stroke="#d8b4fe" filter="url(#shadow)"/>
  <text x="935" y="669" text-anchor="middle" fill="#6b21a8" font-size="12" font-weight="600">5 Gameplay Agents</text>
  <text x="935" y="684" text-anchor="middle" fill="#6b21a8" font-size="10">Narration, Dice, Suggestion, Checkpoint, Recap</text>

  <!-- Arrows to infrastructure -->
  <line x1="350" y1="694" x2="350" y2="730" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="694" x2="750" y2="730" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ════════════════════════════════════════════════ -->
  <!-- INFRASTRUCTURE LAYER -->
  <!-- ════════════════════════════════════════════════ -->
  <text x="30" y="748" fill="#475569" font-size="11" font-weight="600" letter-spacing="1.5">INFRASTRUCTURE</text>

  <rect x="30" y="758" width="340" height="48" rx="8" fill="#fef9c3" stroke="#fbbf24" filter="url(#shadow)"/>
  <text x="200" y="780" text-anchor="middle" fill="#854d0e" font-size="13" font-weight="700">Ollama (Local LLM)</text>
  <text x="200" y="796" text-anchor="middle" fill="#854d0e" font-size="10">llama3.2 / qwen3:14b  +  nomic-embed-text</text>

  <rect x="430" y="758" width="340" height="48" rx="8" fill="#ecfdf5" stroke="#6ee7b7" filter="url(#shadow)"/>
  <text x="600" y="780" text-anchor="middle" fill="#065f46" font-size="13" font-weight="700">Neo4j (Graph DB)</text>
  <text x="600" y="796" text-anchor="middle" fill="#065f46" font-size="10">Game state (OGM)  +  Vector embeddings (768d)</text>

  <rect x="830" y="758" width="240" height="48" rx="8" fill="#f0f9ff" stroke="#7dd3fc" filter="url(#shadow)"/>
  <text x="950" y="780" text-anchor="middle" fill="#0c4a6e" font-size="13" font-weight="700">IngestService</text>
  <text x="950" y="796" text-anchor="middle" fill="#0c4a6e" font-size="10">Parse → Chunk → Embed → Store</text>

  <!-- Legend -->
  <rect x="30" y="82" width="5" height="5" fill="#f59e0b"/>
  <rect x="700" y="68" width="370" height="28" rx="4" fill="#fff" stroke="#e2e8f0"/>
  <line x1="712" y1="82" x2="732" y2="82" stroke="#d97706" stroke-width="2"/>
  <text x="738" y="86" fill="#78350f" font-size="9">Agent flow</text>
  <line x1="790" y1="82" x2="810" y2="82" stroke="#64748b" stroke-width="1.5"/>
  <text x="816" y="86" fill="#475569" font-size="9">Data flow</text>
  <line x1="874" y1="82" x2="894" y2="82" stroke="#64748b" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="900" y="86" fill="#475569" font-size="9">Assembly</text>
  <rect x="948" y="76" width="10" height="10" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-dasharray="3 2"/>
  <text x="964" y="86" fill="#92400e" font-size="9">Agentic zone</text>
</svg>